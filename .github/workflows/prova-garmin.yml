name: Prova Garmin (temporaneo)
on: workflow_dispatch
permissions: { contents: read }
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          node --input-type=module -e "
          const t = async (n, u, o={}) => { try { const r = await fetch(u, o); console.log(n, r.status); } catch (e) { console.log(n, 'errore', e.message); } };
          await t('sso pagina', 'https://sso.garmin.com/sso/signin?id=gauth-widget&embedWidget=true&gauthHost=https://sso.garmin.com/sso/embed&service=https://sso.garmin.com/sso/embed&source=https://sso.garmin.com/sso/embed');
          await t('connectapi senza token', 'https://connectapi.garmin.com/userprofile-service/socialProfile');
          await t('preauthorized senza firma', 'https://connectapi.garmin.com/oauth-service/oauth/preauthorized?ticket=ST-0&login-url=https://sso.garmin.com/sso/embed');
          await t('diauth', 'https://diauth.garmin.com/di-oauth2-service/oauth/token', { method: 'POST' });
          const r = await fetch('https://api.ipify.org'); console.log('IP', await r.text());"
